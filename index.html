    <script>
        (() => {
            const windows = document.querySelectorAll(".retro-window");

            let startX = 0;
            let startY = 0;
            let startWidth = 0;
            let startHeight = 0;
            let activeWindow = null;
            let activeHandle = null;
            let dragOffsetX = 0;
            let dragOffsetY = 0;
            let topZIndex = 30000;
            const minWidth = 240;
            const minHeight = 160;

            const clamp = (value, min, max) => Math.max(min, Math.min(value, max));

            const moveWindow = (win, x, y) => {
                const maxX = window.innerWidth - win.offsetWidth;
                const maxY = window.innerHeight - win.offsetHeight;
                win.style.left = `${clamp(x, 0, Math.max(0, maxX))}px`;
                win.style.top = `${clamp(y, 22, Math.max(22, maxY))}px`;
                win.style.right = "auto";
                win.style.bottom = "auto";
                win.style.position = "absolute";
            };

            windows.forEach((win) => {
                const handle = win.querySelector(".window-titlebar");
                if (!handle) return;

                handle.addEventListener("pointerdown", (event) => {
                    const rect = win.getBoundingClientRect();
                    activeWindow = win;
                    activeHandle = handle;
                    dragOffsetX = event.clientX - rect.left;
                    dragOffsetY = event.clientY - rect.top;
                    moveWindow(win, rect.left, rect.top);
                    win.classList.add("is-dragging");
                    win.style.zIndex = `${++topZIndex}`;
                    handle.setPointerCapture(event.pointerId);
                });

                handle.addEventListener("pointermove", (event) => {
                    if (activeWindow !== win || !win.classList.contains("is-dragging")) return;
                    moveWindow(win, event.clientX - dragOffsetX, event.clientY - dragOffsetY);
                });

                const stopDragging = (event) => {
                    win.classList.remove("is-dragging");
                    if (activeHandle?.hasPointerCapture(event.pointerId)) {
                        activeHandle.releasePointerCapture(event.pointerId);
                    }
                    activeWindow = null;
                    activeHandle = null;
                };

                handle.addEventListener("pointerup", stopDragging);
                handle.addEventListener("pointercancel", stopDragging);
            });

            const win = document.getElementById("opVideoWindow");
            const resizeHandle = win?.querySelector(".video-resize-handle");
            if (!win || !resizeHandle) return;

            resizeHandle.addEventListener("pointerdown", (event) => {
                event.preventDefault();
                const rect = win.getBoundingClientRect();
                startX = event.clientX;
                startY = event.clientY;
                startWidth = rect.width;
                startHeight = rect.height;
                moveWindow(win, rect.left, rect.top);
                win.classList.add("is-resizing");
                win.style.zIndex = `${++topZIndex}`;
                resizeHandle.setPointerCapture(event.pointerId);
            });

            resizeHandle.addEventListener("pointermove", (event) => {
                if (!win.classList.contains("is-resizing")) return;
                const rect = win.getBoundingClientRect();
                const maxWidth = window.innerWidth - rect.left;
                const maxHeight = window.innerHeight - rect.top;
                const nextWidth = startWidth + event.clientX - startX;
                const nextHeight = startHeight + event.clientY - startY;
                win.style.width = `${clamp(nextWidth, minWidth, maxWidth)}px`;
                win.style.height = `${clamp(nextHeight, minHeight, maxHeight)}px`;
            });

            const stopResizing = (event) => {
                win.classList.remove("is-resizing");
                if (resizeHandle.hasPointerCapture(event.pointerId)) {
                    resizeHandle.releasePointerCapture(event.pointerId);
                }
            };

            resizeHandle.addEventListener("pointerup", stopResizing);
            resizeHandle.addEventListener("pointercancel", stopResizing);
        })();
    </script>
</body>
